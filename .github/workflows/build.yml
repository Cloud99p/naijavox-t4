name: build

# Runpod can build from a repo, but a prebuilt image is far easier to point a
# template at. This workflow pushes to Docker Hub on every push to main, so the
# image tag stays stable and the Runpod template never needs rewriting.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: cloudit2/naijavox-t4:latest
          # ghcr/dockerhub layer cache keeps rebuilds to minutes, not the
          # 13-minute first pull we already paid for locally.
          cache-from: type=gha
          cache-to: type=gha,mode=max
